<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Giharrak errepasoa</title>
<style>
  :root {
    --bg: #f4f1ec;
    --bg2: #ebe5dc;
    --card: #ffffff;
    --ink: #1c2321;
    --muted: #6d7773;
    --line: #e4ded4;
    --soft: #f7f4ef;
    --accent: #c2412d;
    --accent-ink: #ffffff;
    --ok: #188a4f;
    --ok-bg: #e2f4ea;
    --bad: #c93a32;
    --bad-bg: #fbe6e3;
    --shadow: 0 1px 2px rgba(40,30,20,.05), 0 8px 28px rgba(40,30,20,.08);
    --t-GE: #0f766e;
    --t-GGA: #4f46e5;
    --t-BGA: #b45309;
    --t-ALL: #c2412d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614;
      --bg2: #0d100f;
      --card: #1b211f;
      --ink: #edf1ef;
      --muted: #96a19c;
      --line: #2b3431;
      --soft: #222927;
      --accent: #ef7a5f;
      --accent-ink: #1a0f0b;
      --ok: #4ccf8a;
      --ok-bg: #163426;
      --bad: #ff7b70;
      --bad-bg: #3b1c1a;
      --shadow: 0 8px 28px rgba(0,0,0,.35);
      --t-GE: #2dd4bf;
      --t-GGA: #a5b4fc;
      --t-BGA: #fbbf24;
      --t-ALL: #ef7a5f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: radial-gradient(1200px 600px at 50% -200px, var(--bg2), var(--bg) 70%) fixed, var(--bg);
    color: var(--ink);
    font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(16px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  button { font: inherit; color: inherit; }

  /* ---------- header ---------- */
  header { padding: 14px 0 10px; display: grid; gap: 12px; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; }
  .brand h1 .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--tc, var(--accent)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tc, var(--accent)) 20%, transparent); }
  .pic .count.score { left: auto; right: 10px; }
  .pic .score:empty { display: none; }
  .pic .score b { color: #188a4f; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg {
    display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 3px; box-shadow: var(--shadow); gap: 2px;
  }
  .seg button {
    border: 0; background: none; padding: 8px 12px; border-radius: 9px; cursor: pointer;
    font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap;
  }
  .seg button.on { background: var(--tc, var(--accent)); color: #fff; }
  @media (prefers-color-scheme: dark) { .seg button.on { color: #101413; } }
  #topics { flex: 1 1 auto; }
  .controls .seg { width: 100%; }
  #topics button { flex: 1; }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px 7px 12px;
    box-shadow: var(--shadow); font-size: 14px; font-weight: 600; color: var(--muted);
  }
  .toggle .sw { width: 36px; height: 22px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; }
  .toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .toggle[aria-checked="true"] .sw { background: var(--tc, var(--accent)); }
  .toggle[aria-checked="true"] .sw::after { transform: translateX(14px); }
  .toggle .lbl-on { display: none; }
  .toggle[aria-checked="true"] .lbl-on { display: inline; }
  .toggle[aria-checked="true"] .lbl-off { display: none; }

  /* ---------- card ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .pic {
    position: relative; background: #fff; display: flex; align-items: center; justify-content: center;
    height: min(44vh, 380px); cursor: zoom-in; border-bottom: 1px solid var(--line);
  }
  .pic img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; transition: opacity .2s; }
  .pic .count {
    position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: 700; letter-spacing: .02em;
    background: rgba(255,255,255,.92); color: #333; padding: 4px 8px; border-radius: 99px; border: 1px solid #e6e1d8;
    font-variant-numeric: tabular-nums;
  }
  .pic .zoomhint { position: absolute; bottom: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.92); border: 1px solid #e6e1d8; display: grid; place-items: center; color: #555; }
  .body { padding: 14px 16px 16px; }

  /* steps */
  .steps { display: flex; gap: 6px; margin-bottom: 12px; }
  .steps span { flex: 1; height: 5px; border-radius: 99px; background: var(--line); transition: background .25s; }
  .steps span.cur { background: color-mix(in srgb, var(--ink) 45%, var(--line)); }
  .steps span.ok { background: var(--ok); }
  .steps span.bad { background: var(--bad); }

  .done { display: grid; gap: 8px; margin-bottom: 12px; }
  .row { border-radius: 12px; padding: 9px 12px; background: var(--soft); border-left: 4px solid var(--line); animation: pop .25s ease; }
  .row.ok { border-left-color: var(--ok); }
  .row.bad { border-left-color: var(--bad); }
  .row .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
  .row .v { font-weight: 600; margin-top: 2px; }
  .row.name .v { font-size: 19px; }
  .row .k i { font-style: normal; }
  .row.ok .k i { color: var(--ok); }
  .row.bad .k i { color: var(--bad); }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }

  .q { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--tc); font-weight: 800; margin: 4px 0 2px; }
  .qt { font-size: 20px; font-weight: 700; margin: 0 0 12px; letter-spacing: -.01em; }

  .opts { display: grid; gap: 8px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 12px;
    cursor: pointer; transition: border-color .15s, background .15s, transform .05s;
  }
  .opt:hover:not(:disabled) { border-color: color-mix(in srgb, var(--tc) 55%, var(--line)); }
  .opt:active:not(:disabled) { transform: scale(.99); }
  .opt b {
    flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: var(--soft); color: var(--muted); font-size: 13px; font-weight: 800;
  }
  .opt span { padding-top: 2px; font-size: 15.5px; }
  .opt:disabled { cursor: default; opacity: .55; }
  .opt.ok { border-color: var(--ok); background: var(--ok-bg); opacity: 1; }
  .opt.ok b { background: var(--ok); color: #fff; }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); opacity: 1; }
  .opt.bad b { background: var(--bad); color: #fff; }

  .hidden-ans {
    width: 100%; border: 2px dashed var(--line); background: var(--soft); border-radius: 14px;
    padding: 22px 14px; cursor: pointer; text-align: center; color: var(--muted); font-weight: 600;
  }
  .hidden-ans:hover { border-color: color-mix(in srgb, var(--tc) 50%, var(--line)); color: var(--ink); }
  .revealed { border-radius: 14px; padding: 14px; background: var(--soft); border: 1.5px solid var(--line); font-weight: 650; font-size: 17px; animation: pop .2s ease; }
  .self { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

  .btn {
    border: 0; border-radius: 14px; padding: 14px; font-weight: 700; cursor: pointer; width: 100%;
    background: var(--tc); color: #fff; font-size: 16px;
  }
  @media (prefers-color-scheme: dark) { .btn { color: #101413; } }
  .btn.ghost { background: var(--soft); color: var(--ink); border: 1.5px solid var(--line); }
  .btn.okb { background: var(--ok); color: #fff; }
  .btn.badb { background: var(--bad); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.okb, .btn.badb { color: #101413; } }
  .next { margin-top: 12px; display: none; }
  .next.show { display: block; animation: pop .2s ease; }

  .hint { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 12px; }
  kbd { font: inherit; font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 4px; background: var(--card); }
  @media (hover: none) { .hint { display: none; } }

  .zoom { position: fixed; inset: 0; background: rgba(10,12,11,.9); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; padding: 12px; }
  .zoom.show { display: flex; }
  .zoom img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 10px; }

  @media (max-width: 420px) {
    .seg button { padding: 8px 9px; font-size: 13.5px; }
    .qt { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1><span class="dot"></span>Giharrak</h1>
      <button class="toggle" id="mode" role="switch" aria-checked="false" title="Aukerak (ABCDE) edo erantzuna ezkutuan">
        <span class="lbl-off">ABCDE</span><span class="lbl-on">Ezkutuan</span><span class="sw"></span>
      </button>
    </div>
    <div class="controls">
      <div class="seg" id="topics" role="tablist" aria-label="Gaia">
        <button data-t="GE" role="tab">Enborra</button>
        <button data-t="GGA" role="tab">GGA</button>
        <button data-t="BGA" role="tab">BGA</button>
        <button data-t="ALL" role="tab">Denak</button>
      </div>
    </div>
  </header>

  <main class="card">
    <div class="pic" id="pic">
      <img id="img" alt="Giharraren irudia">
      <span class="count" id="count"></span>
      <span class="count score" id="score"></span>
      <span class="zoomhint" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></svg>
      </span>
    </div>
    <div class="body">
      <div class="steps" id="steps"></div>
      <div class="done" id="done"></div>
      <div id="ask">
        <div class="q" id="q"></div>
        <div class="qt" id="qt"></div>
        <div id="area"></div>
      </div>
      <button class="btn next" id="next"></button>
    </div>
  </main>
  <div class="hint"><kbd>A</kbd>–<kbd>E</kbd> aukeratu · <kbd>Espazioa</kbd> erakutsi · <kbd>Enter</kbd> hurrengoa</div>
</div>

<div class="zoom" id="zoom"><img id="zoom-img" alt=""></div>

<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const STEPS = [
  { k: 'name', label: 'Izena',      q: 'Zein gihar da?' },
  { k: 'T',    label: 'Txertapena', q: 'Non txertatzen da?' },
  { k: 'J',    label: 'Jatorria',   q: 'Non du jatorria?' },
  { k: 'F',    label: 'Funtzioa',   q: 'Zein da bere funtzioa?' },
];
const TOPIC_NAME = { GE: 'Gorputz enborra', GGA: 'Goiko gorputz adarra', BGA: 'Beheko gorputz adarra', ALL: 'Denak' };

const store = {
  get(k, d) { try { const v = localStorage.getItem('giharrak.' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('giharrak.' + k, v); } catch {} },
};

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

let topic = store.get('topic', 'GE');
let hidden = store.get('mode', 'abcde') === 'hidden';
let deck = [], pos = 0, cur = null, steps = [], si = 0, answered = false, results = [];
let score = { ok: 0, n: 0 };

function pool() { return topic === 'ALL' ? ITEMS : ITEMS.filter(it => it.topic === topic); }

function distractors(it, k) {
  const right = norm(it[k]);
  const seen = new Set([right]);
  // same group first, then same topic, then anything
  const tiers = [
    pool().filter(x => x.group === it.group),
    pool(),
    ITEMS,
  ].map(list => shuffle(list.filter(x => x !== it && x[k])));
  const out = [];
  for (const list of tiers) for (const x of list) {
    const n = norm(x[k]);
    if (seen.has(n)) continue;
    seen.add(n); out.push(x[k]);
    if (out.length === 4) return out;
  }
  return out;
}

function newDeck() { deck = shuffle(pool().map(it => it.id)); pos = 0; }

function setTopic(t) {
  topic = t; store.set('topic', t);
  document.documentElement.style.setProperty('--tc', `var(--t-${t})`);
  for (const b of $('topics').children) b.classList.toggle('on', b.dataset.t === t);
  score = { ok: 0, n: 0 };
  newDeck(); loadItem();
}

function setMode(h) {
  hidden = h; store.set('mode', h ? 'hidden' : 'abcde');
  $('mode').setAttribute('aria-checked', String(h));
  if (cur && !answered) renderStep();
}

function updateScore() {
  const pct = score.n ? Math.round(100 * score.ok / score.n) : 0;
  $('score').innerHTML = score.n ? `<b>✓ ${score.ok}</b> / ${score.n} · ${pct}%` : '';
}

function loadItem() {
  if (pos >= deck.length) newDeck();
  const id = deck[pos++];
  cur = ITEMS.find(it => it.id === id);
  steps = STEPS.filter(s => cur[s.k]);
  si = 0; results = [];
  $('img').style.opacity = 0;
  $('img').onload = () => { $('img').style.opacity = 1; };
  $('img').src = 'img/' + cur.id + '.jpg';
  const nextId = deck[pos]; if (nextId) new Image().src = 'img/' + nextId + '.jpg';
  $('count').textContent = `${pos} / ${deck.length}`;
  $('done').innerHTML = '';
  updateScore();
  renderStep();
}

function renderSteps() {
  $('steps').innerHTML = steps.map((s, i) =>
    `<span class="${results[i] === true ? 'ok' : results[i] === false ? 'bad' : i === si ? 'cur' : ''}" title="${s.label}"></span>`).join('');
}

function renderStep() {
  answered = false;
  const s = steps[si];
  renderSteps();
  $('ask').hidden = false;
  $('q').textContent = `${si + 1}/${steps.length} · ${s.label}`;
  $('qt').textContent = s.q;
  $('next').classList.remove('show');
  const area = $('area');
  area.innerHTML = '';
  if (hidden) {
    const b = document.createElement('button');
    b.className = 'hidden-ans'; b.id = 'reveal';
    b.textContent = 'Pentsatu erantzuna… eta sakatu erakusteko';
    b.onclick = reveal;
    area.appendChild(b);
  } else {
    const opts = shuffle([cur[s.k], ...distractors(cur, s.k)]);
    const wrap = document.createElement('div'); wrap.className = 'opts'; wrap.id = 'opts';
    opts.forEach((a, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = `<b>${'ABCDE'[i]}</b><span></span>`;
      b.querySelector('span').textContent = a;
      b.dataset.right = String(a === cur[s.k]);
      b.onclick = () => pick(b);
      wrap.appendChild(b);
    });
    area.appendChild(wrap);
  }
}

function pick(btn) {
  if (answered) return;
  const right = btn.dataset.right === 'true';
  for (const b of $('opts').children) {
    b.disabled = true;
    if (b.dataset.right === 'true') b.classList.add('ok');
  }
  if (!right) btn.classList.add('bad');
  finish(right, 450);
}

function reveal() {
  if (answered) return;
  const s = steps[si];
  const area = $('area');
  area.innerHTML = `<div class="revealed"></div>
    <div class="self">
      <button class="btn badb" id="no">✗ Ez nekien</button>
      <button class="btn okb" id="yes">✓ Banekien</button>
    </div>`;
  area.querySelector('.revealed').textContent = cur[s.k];
  $('yes').onclick = () => finish(true, 0);
  $('no').onclick = () => finish(false, 0);
  answered = 'revealed';
}

function finish(right, delay) {
  answered = true;
  results[si] = right;
  score.n++; if (right) score.ok++;
  updateScore(); renderSteps();
  const s = steps[si];
  const last = si === steps.length - 1;
  const commit = () => {
    const row = document.createElement('div');
    row.className = `row ${right ? 'ok' : 'bad'}${s.k === 'name' ? ' name' : ''}`;
    row.innerHTML = `<div class="k"><span>${s.label}</span><i>${right ? '✓' : '✗'}</i></div><div class="v"></div>`;
    row.querySelector('.v').textContent = cur[s.k];
    $('done').appendChild(row);
    if (last) {
      $('ask').hidden = true;
      $('next').textContent = 'Hurrengo giharra →';
      $('next').classList.add('show');
      $('next').focus({ preventScroll: true });
      $('next').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
      si++; renderStep();
    }
  };
  if (hidden || !delay) { commit(); return; }
  // In ABCDE mode let the colours register briefly; wrong answers wait for a tap.
  if (right) setTimeout(commit, delay);
  else {
    $('next').textContent = 'Jarraitu →';
    $('next').classList.add('show');
    $('next').onclick = () => { $('next').onclick = onNext; commit(); };
    $('next').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function onNext() { loadItem(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
$('next').onclick = onNext;

for (const b of $('topics').children) b.onclick = () => setTopic(b.dataset.t);
$('mode').onclick = () => setMode(!hidden);
$('pic').onclick = () => { $('zoom-img').src = $('img').src; $('zoom').classList.add('show'); };
$('zoom').onclick = () => $('zoom').classList.remove('show');

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('zoom').classList.contains('show')) { if (e.key === 'Escape') $('zoom').classList.remove('show'); return; }
  const k = e.key.toLowerCase();
  if (!answered && !hidden && $('opts')) {
    const i = 'abcde'.indexOf(k) >= 0 ? 'abcde'.indexOf(k) : '12345'.indexOf(k);
    const b = $('opts').children[i];
    if (i >= 0 && b) { e.preventDefault(); b.click(); return; }
  }
  if (hidden && !answered && (k === ' ' || k === 'enter')) { e.preventDefault(); reveal(); return; }
  if (answered === 'revealed') {
    if (k === 'arrowright' || k === 'y' || k === 'enter') { e.preventDefault(); $('yes').click(); return; }
    if (k === 'arrowleft' || k === 'n') { e.preventDefault(); $('no').click(); return; }
  }
  if ((k === 'enter' || k === ' ') && $('next').classList.contains('show')) { e.preventDefault(); $('next').click(); }
});

setMode(hidden);
setTopic(TOPIC_NAME[topic] ? topic : 'GE');
</script>
</body>
</html>
